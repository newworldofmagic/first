<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора — ZPG Seasonal Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=scale');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #e2e8f0; }
        .heading-font { font-family: 'Cinzel', serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600/20 border border-indigo-500/30 p-2 rounded-lg text-indigo-400">
                <i class="fa-solid fa-server text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-100 tracking-wide heading-font">ZPG WORLD CREATOR</h1>
                <p class="text-xs text-slate-400">Управление сезонами и генерацией миров</p>
            </div>
        </div>
        <div class="flex gap-2 text-xs">
            <button onclick="switchAdminTab('worlds')" id="nav-btn-worlds" class="bg-indigo-600 text-white px-3 py-2 rounded font-medium shadow">
                <i class="fa-solid fa-globe mr-1.5"></i> Активные Миры
            </button>
            <button onclick="switchAdminTab('create')" id="nav-btn-create" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded font-medium border border-slate-700 transition">
                <i class="fa-solid fa-plus mr-1.5"></i> Создать Новый Мир
            </button>
        </div>
    </header>

    <!-- Main Admin Workspace -->
    <main class="flex-1 p-4 overflow-hidden grid grid-cols-12 gap-4">

        <!-- TAB 1: LIST OF ACTIVE WORLDS -->
        <section id="tab-worlds" class="col-span-12 flex flex-col h-full bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h2 class="text-md font-bold text-slate-200 heading-font">Запущенные Сезоны (Миры)</h2>
                <span class="text-xs text-indigo-400 font-mono bg-indigo-950/60 border border-indigo-800/50 px-2.5 py-1 rounded">Всего миров: <b id="worlds-count">1</b></span>
            </div>

            <!-- Worlds Table Grid -->
            <div id="worlds-list" class="grid grid-cols-3 gap-4 overflow-y-auto custom-scroll pr-1">
                <!-- World Cards populated via JS -->
            </div>
        </section>

        <!-- TAB 2: CREATE / EDIT WORLD FORM (Hidden by default) -->
        <section id="tab-create" class="hidden col-span-12 grid grid-cols-12 gap-4 h-full overflow-y-auto custom-scroll pr-1">
            
            <!-- Left Config Column (6 Cols) -->
            <div class="col-span-6 space-y-4">
                
                <!-- General Info -->
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-3">
                    <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-sliders mr-2"></i> Параметры Сезона
                    </h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Название Мира / Сезона</label>
                        <input type="text" id="world-name" value="Пандория: Сезон I" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Сеттинг / Жанр</label>
                            <select id="world-setting" onchange="applySettingPreset()" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                <option value="fantasy">Фэнтези (Классика)</option>
                                <option value="dark-fantasy">Тёмное Фэнтези</option>
                                <option value="scifi">Космоопера / Sci-Fi</option>
                                <option value="medieval">Средневековье (Без магии)</option>
                                <option value="cyberpunk">Киберпанк</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Длительность (Дней)</label>
                            <input type="number" id="world-days" value="14" min="1" max="90" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Промпт ИИ-Рассказчика (Стиль дневника)</label>
                        <textarea id="world-prompt" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
                    </div>
                </div>

                <!-- Classes Constructor -->
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center">
                            <i class="fa-solid fa-users-gear mr-2"></i> Доступные Классы
                        </h3>
                        <button onclick="addClassRow()" class="bg-indigo-900/50 hover:bg-indigo-800 text-indigo-200 border border-indigo-700 text-[11px] px-2 py-1 rounded">
                            <i class="fa-solid fa-plus mr-1"></i> Добавить Класс
                        </button>
                    </div>

                    <div id="classes-list" class="space-y-2 max-h-48 overflow-y-auto custom-scroll pr-1">
                        <!-- Classes inputs generated dynamically -->
                    </div>
                </div>

            </div>

            <!-- Right Config Column: Map Generator (6 Cols) -->
            <div class="col-span-6 space-y-4 flex flex-col">
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-3 flex-1 flex flex-col">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center">
                            <i class="fa-solid fa-map mr-2"></i> Конструктор Карт и Сеток (3x3)
                        </h3>
                        <button onclick="autoGenerateMap()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] px-2.5 py-1 rounded border border-slate-700">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1 text-amber-400"></i> Сгенерировать ИИ
                        </button>
                    </div>

                    <p class="text-xs text-slate-400">Кликните на сектор карты, чтобы настроить его статус (Город / Дикая зона / Босс).</p>

                    <!-- 3x3 Map Preview -->
                    <div id="admin-map-grid" class="grid grid-cols-3 gap-2 flex-1 my-2">
                        <!-- Interactive Grid Cells -->
                    </div>

                    <!-- Selected Zone Quick Edit -->
                    <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-slate-500 block text-[10px] uppercase font-bold">Сектор:</span>
                            <span id="selected-cell-title" class="font-bold text-slate-200">Сектор [0, 0]</span>
                        </div>
                        <div>
                            <label class="text-slate-500 block text-[10px] uppercase font-bold">Тип Зоны:</label>
                            <select id="zone-type-select" onchange="updateSelectedZoneType()" class="bg-slate-900 border border-slate-700 text-xs rounded px-1.5 py-0.5 text-slate-200 w-full">
                                <option value="town">Город / Безопасно</option>
                                <option value="wild">Дикая Земля (Фарм)</option>
                                <option value="boss">Логово Босса</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Launch Button -->
                <button onclick="launchNewWorld()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket text-lg"></i> ЗАПУСТИТЬ НОВЫЙ МИР (СЕЗОН)
                </button>
            </div>

        </section>

    </main>

    <!-- JS Logic for Admin Dashboard -->
    <script>
        // Storage of Active Worlds
        let activeWorlds = [
            {
                id: "w-1",
                name: "Пандория: Альфа Сезон",
                setting: "Фэнтези (Классика)",
                daysLeft: 12,
                totalDays: 14,
                playersCount: 18,
                status: "active",
                classes: ["Воин", "Маг", "Следопыт", "Плут"]
            }
        ];

        let currentMapGrid = Array(9).fill(null).map((_, i) => ({
            id: i,
            name: i === 0 ? "Стартовый Город" : `Неизведанная Зона ${i}`,
            type: i === 0 ? "town" : "wild"
        }));

        let activeSelectedCell = 0;

        let settingPrompts = {
            "fantasy": "Ты — герой фэнтези-мира. Пиши дневник атмосферно, описывай монстров, таверны и старую магию.",
            "dark-fantasy": "Ты выживаешь в мрачном мире сурового фэнтези. Описывай грязь, кровь, страх и тяжелые победы.",
            "scifi": "Ты — наемник в далеком космосе. Используй футуристический сленг, упоминай скафандры, плазму и астероиды.",
            "medieval": "Реалистичное средневековье без волшебства. Описывай усталость, рыцарей, болезни и звон стали.",
            "cyberpunk": "Мрачный неоновый город. Пиши про импланты, кредиты, банды и хакерство."
        };

        // --- NAVIGATION TABS ---
        function switchAdminTab(tab) {
            document.getElementById('tab-worlds').classList.toggle('hidden', tab !== 'worlds');
            document.getElementById('tab-create').classList.toggle('hidden', tab !== 'create');
            
            document.getElementById('nav-btn-worlds').className = tab === 'worlds' ? "bg-indigo-600 text-white px-3 py-2 rounded font-medium shadow" : "bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded font-medium border border-slate-700 transition";
            document.getElementById('nav-btn-create').className = tab === 'create' ? "bg-indigo-600 text-white px-3 py-2 rounded font-medium shadow" : "bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded font-medium border border-slate-700 transition";
        }

        // --- RENDER ACTIVE WORLDS ---
        function renderWorldsList() {
            const container = document.getElementById('worlds-list');
            container.innerHTML = '';
            document.getElementById('worlds-count').innerText = activeWorlds.length;

            activeWorlds.forEach(w => {
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col justify-between space-y-3 relative overflow-hidden";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
                                ${w.status === 'active' ? '● Активен' : 'Завершен'}
                            </span>
                            <span class="text-xs text-slate-400"><i class="fa-solid fa-users mr-1"></i> ${w.playersCount} игроков</span>
                        </div>
                        <h3 class="text-md font-bold text-slate-100 heading-font mt-1">${w.name}</h3>
                        <p class="text-xs text-slate-400 mb-2">Жанр: <span class="text-slate-200">${w.setting}</span></p>
                        
                        <div class="text-[11px] text-slate-400 space-y-1 bg-slate-900 p-2 rounded border border-slate-800/80">
                            <div>Осталось: <b>${w.daysLeft} из ${w.totalDays} дней</b></div>
                            <div class="w-full bg-slate-800 rounded-full h-1.5 mt-1">
                                <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${(w.daysLeft/w.totalDays)*100}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-2 border-t border-slate-800/80">
                        <button onclick="alert('Скопирована прямая ссылка для игроков!')" class="flex-1 bg-indigo-900/40 hover:bg-indigo-800/60 text-indigo-200 border border-indigo-700/50 py-1.5 rounded text-xs transition">
                            <i class="fa-solid fa-link mr-1"></i> Ссылка
                        </button>
                        <button onclick="closeWorld('${w.id}')" class="bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 px-2.5 py-1.5 rounded text-xs transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- CLASSES CONSTRUCTOR ---
        let defaultClasses = ["Воин", "Маг", "Следопыт", "Плут"];
        
        function renderClassesInput() {
            const list = document.getElementById('classes-list');
            list.innerHTML = '';
            defaultClasses.forEach((cls, idx) => {
                const item = document.createElement('div');
                item.className = "flex gap-2 items-center";
                item.innerHTML = `
                    <input type="text" value="${cls}" onchange="defaultClasses[${idx}]=this.value" class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    <button onclick="removeClassRow(${idx})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                `;
                list.appendChild(item);
            });
        }

        function addClassRow() {
            defaultClasses.push("Новый Класс");
            renderClassesInput();
        }

        function removeClassRow(idx) {
            defaultClasses.splice(idx, 1);
            renderClassesInput();
        }

        // --- MAP CONSTRUCTOR ---
        function renderAdminMap() {
            const grid = document.getElementById('admin-map-grid');
            grid.innerHTML = '';
            currentMapGrid.forEach((cell, idx) => {
                const el = document.createElement('div');
                const isSelected = idx === activeSelectedCell;
                let bgClass = "bg-slate-950 border-slate-800";
                let icon = "fa-compass";
                
                if (cell.type === 'town') { bgClass = "bg-emerald-950/40 border-emerald-700/60"; icon = "fa-house-chimney text-emerald-400"; }
                if (cell.type === 'wild') { bgClass = "bg-slate-950 border-slate-800"; icon = "fa-tree text-slate-500"; }
                if (cell.type === 'boss') { bgClass = "bg-rose-950/40 border-rose-700/60"; icon = "fa-skull text-rose-400"; }

                el.className = `p-2 rounded-lg border text-xs cursor-pointer flex flex-col justify-between transition ${bgClass} ${isSelected ? 'ring-2 ring-indigo-500' : 'hover:border-slate-600'}`;
                el.onclick = () => selectMapCell(idx);
                el.innerHTML = `
                    <div class="flex justify-between items-center font-bold text-slate-300">
                        <span class="truncate">${cell.name}</span>
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <span class="text-[10px] text-slate-500 uppercase mt-2">${cell.type}</span>
                `;
                grid.appendChild(el);
            });
        }

        function selectMapCell(idx) {
            activeSelectedCell = idx;
            const cell = currentMapGrid[idx];
            document.getElementById('selected-cell-title').innerText = `${cell.name} [Сектор ${idx + 1}]`;
            document.getElementById('zone-type-select').value = cell.type;
            renderAdminMap();
        }

        function updateSelectedZoneType() {
            const val = document.getElementById('zone-type-select').value;
            currentMapGrid[activeSelectedCell].type = val;
            renderAdminMap();
        }

        function applySettingPreset() {
            const setting = document.getElementById('world-setting').value;
            document.getElementById('world-prompt').value = settingPrompts[setting] || "";
        }

        function autoGenerateMap() {
            const prefixes = ["Темный", "Забытый", "Кровавый", "Туманный", "Солнечный", "Мертвый"];
            const places = ["Дол", "Пик", "Лес", "Каньон", "Аванпост", "Овраг"];
            
            currentMapGrid.forEach((cell, idx) => {
                if (idx === 0) {
                    cell.name = "Центральная Цитадель";
                    cell.type = "town";
                } else if (idx === 8) {
                    cell.name = "Логово Владыки";
                    cell.type = "boss";
                } else {
                    const p = prefixes[Math.floor(Math.random() * prefixes.length)];
                    const pl = places[Math.floor(Math.random() * places.length)];
                    cell.name = `${p} ${pl}`;
                    cell.type = "wild";
                }
            });
            renderAdminMap();
        }

        // --- LAUNCH NEW WORLD ---
        function launchNewWorld() {
            const name = document.getElementById('world-name').value;
            const settingSelect = document.getElementById('world-setting');
            const settingText = settingSelect.options[settingSelect.selectedIndex].text;
            const days = parseInt(document.getElementById('world-days').value);

            const newWorld = {
                id: "w-" + (activeWorlds.length + 1),
                name: name,
                setting: settingText,
                daysLeft: days,
                totalDays: days,
                playersCount: 0,
                status: "active",
                classes: [...defaultClasses]
            };

            activeWorlds.unshift(newWorld);
            renderWorldsList();
            switchAdminTab('worlds');
            alert(`🎉 Мир «${name}» успешно запущен! Теперь игроки могут регистрироваться и входить в этот сезон.`);
        }

        function closeWorld(id) {
            if (confirm("Вы уверены, что хотите завершить этот сезон раньше времени?")) {
                activeWorlds = activeWorlds.filter(w => w.id !== id);
                renderWorldsList();
            }
        }

        // --- INIT ---
        applySettingPreset();
        renderClassesInput();
        renderAdminMap();
        renderWorldsList();
    </script>
</body>
</html>
